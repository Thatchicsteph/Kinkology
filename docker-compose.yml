services:
  mongo:
    image: mongo:7.0
    restart: unless-stopped
    volumes:
      - mongo_data:/data/db
    networks:
      - kinkology

  backend:
    build: ./backend
    restart: unless-stopped
    environment:
      MONGO_URL: mongodb://mongo:27017
      DB_NAME: kinkology
      CORS_ORIGINS: ${CORS_ORIGINS:-}
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET in .env (copy env.docker.example to .env)}
      # WebRTC (OBS -> browser) needs a reachable UDP port range from the host.
      # Publish the same range in `ports:` below and advertise a host-reachable
      # IP so ICE actually connects instead of hanging in "connecting".
      STREAM_UDP_MIN: ${STREAM_UDP_MIN:-50000}
      STREAM_UDP_MAX: ${STREAM_UDP_MAX:-50099}
      # STUN servers (comma-separated). Defaults to Google + Cloudflare public
      # STUN; override in .env only if you need private/self-hosted STUN.
      STREAM_STUN_SERVERS: ${STREAM_STUN_SERVERS:-}
      # Optional TURN relay for mobile clients behind symmetric NAT / CGNAT
      # (most 4G/5G carriers). Without this, direct WebRTC fails on those
      # networks. Bring your own TURN (e.g. Twilio, Cloudflare, self-hosted
      # coturn) or leave blank to disable.
      STREAM_TURN_URL: ${STREAM_TURN_URL:-}
      STREAM_TURN_USERNAME: ${STREAM_TURN_USERNAME:-}
      STREAM_TURN_PASSWORD: ${STREAM_TURN_PASSWORD:-}
      # 127.0.0.1 works when OBS runs on the same Mac as Docker. For LAN OBS,
      # set this to the Mac's LAN IP (e.g., 192.168.1.42) in .env. For remote
      # OBS behind a public domain, set it to the public IP / DDNS host.
      STREAM_PUBLIC_IP: ${STREAM_PUBLIC_IP:-127.0.0.1}
      # For same-Mac OBS, its host candidates are 127.0.0.1 which the container
      # can't reach on the loopback interface. Rewrite them to something the
      # container CAN reach; on Docker Desktop that's `host.docker.internal`.
      STREAM_PEER_IP: ${STREAM_PEER_IP:-host.docker.internal}
    ports:
      # Publish the WebRTC UDP port range to the host so OBS can send RTP in.
      # If you change STREAM_UDP_MIN/MAX in .env, change these too.
      - "${STREAM_UDP_MIN:-50000}-${STREAM_UDP_MAX:-50099}:${STREAM_UDP_MIN:-50000}-${STREAM_UDP_MAX:-50099}/udp"
    depends_on:
      - mongo
    networks:
      - kinkology
    # Docker Desktop for Mac needs this to resolve host.docker.internal from
    # inside the container (already implicit on Docker Desktop, explicit on
    # native Linux where it maps to the host gateway).
    extra_hosts:
      - "host.docker.internal:host-gateway"

  web:
    build:
      context: ./frontend
      args:
        REACT_APP_BACKEND_URL: ""
    restart: unless-stopped
    environment:
      DOMAIN: ${DOMAIN:-ChangeMe}
    ports:
      - "80:80"
      - "443:443"
    depends_on:
      - backend
    volumes:
      - caddy_data:/data
      - caddy_config:/config
    networks:
      - kinkology

volumes:
  mongo_data:
  caddy_data:
  caddy_config:

networks:
  kinkology:
