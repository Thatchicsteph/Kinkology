services:
  mongo:
    image: mongo:7.0
    restart: unless-stopped
    volumes:
      - mongo_data:/data/db
    networks:
      - kinkology

  backend:
    build: ./backend
    restart: unless-stopped
    environment:
      MONGO_URL: mongodb://mongo:27017
      DB_NAME: kinkology
      CORS_ORIGINS: ${CORS_ORIGINS:-}
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET in .env (copy env.docker.example to .env)}
      # WebRTC direct-UDP fallbacks — leave blank to route mobile viewers via
      # Cloudflare TURN relay (recommended, works over any NAT/carrier). Only
      # opt into these if you know your network can do direct UDP (same-LAN
      # phones, or router with UDP port forwarding). Setting them enables the
      # aioice port-range + host-IP rewrite patch which is untested against
      # every TURN client and can break Cloudflare relay for mobile viewers.
      STREAM_UDP_MIN: ${STREAM_UDP_MIN:-}
      STREAM_UDP_MAX: ${STREAM_UDP_MAX:-}
      # STUN servers (comma-separated). Defaults to Google + Cloudflare public
      # STUN; override in .env only if you need private/self-hosted STUN.
      STREAM_STUN_SERVERS: ${STREAM_STUN_SERVERS:-}
      # Optional STATIC TURN relay if you're not using the built-in Cloudflare
      # Calls one-click. Leave blank to use the admin UI card instead.
      STREAM_TURN_URL: ${STREAM_TURN_URL:-}
      STREAM_TURN_USERNAME: ${STREAM_TURN_USERNAME:-}
      STREAM_TURN_PASSWORD: ${STREAM_TURN_PASSWORD:-}
      # Encryption key for storing Cloudflare TURN token at rest. Generate
      # once with: python -c "from cryptography.fernet import Fernet;
      # print(Fernet.generate_key().decode())". Leaving it blank means saved
      # Cloudflare credentials don't survive a restart.
      TURN_CREDENTIAL_ENCRYPTION_KEY: ${TURN_CREDENTIAL_ENCRYPTION_KEY:-}
      # Advertised host IP in ICE candidates — leave blank to let aioice
      # pick from real interfaces (works when Cloudflare TURN relays traffic).
      STREAM_PUBLIC_IP: ${STREAM_PUBLIC_IP:-}
      STREAM_PEER_IP: ${STREAM_PEER_IP:-}
    # ports:
      # Publish the WebRTC UDP port range only if you enabled STREAM_UDP_MIN/MAX
      # above AND set matching values in .env. Otherwise ICE runs via Cloudflare
      # TURN and needs no host-side UDP publishing.
      # - "50000-50099:50000-50099/udp"
    depends_on:
      - mongo
    networks:
      - kinkology
    # Docker Desktop for Mac needs this to resolve host.docker.internal from
    # inside the container (already implicit on Docker Desktop, explicit on
    # native Linux where it maps to the host gateway).
    extra_hosts:
      - "host.docker.internal:host-gateway"

  web:
    build:
      context: ./frontend
      args:
        REACT_APP_BACKEND_URL: ""
    restart: unless-stopped
    environment:
      DOMAIN: ${DOMAIN:-ChangeMe}
    ports:
      - "80:80"
      - "443:443"
    depends_on:
      - backend
    volumes:
      - caddy_data:/data
      - caddy_config:/config
    networks:
      - kinkology

volumes:
  mongo_data:
  caddy_data:
  caddy_config:

networks:
  kinkology:
